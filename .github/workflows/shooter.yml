name: Generate Space Shooter Animation

on:
  schedule:
    # Run automatically every day at midnight
    - cron: "0 0 * * *" 
  
  # Allows you to run the job manually
  workflow_dispatch:

jobs:
  update-game:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Step 1: Download the repository code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # CRITICAL: Needed for the action to amend its commits
          
      # Step 2: Generate the space shooter GIF and commit it
      - name: Generate Space Shooter Game
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'shooter.gif'
          strategy: 'random' # Options: random, row, column
          fps: 40
